[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.13"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# SPEC §17: no unwrap/expect outside tests (allowed in tests via clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
