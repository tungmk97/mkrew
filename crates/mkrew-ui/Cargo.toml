[package]
name = "mkrew-ui"
description = "Mkrew desktop app `mkrew` (GPUI, SPEC §10)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "mkrew"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
# Basic auth for Jira (SPEC §20I); 0.22 is already in the tree.
base64 = "0.22"
# `future::or` for the paint-or-timeout wait; 2.x is already in the tree via gpui.
futures-lite = "2"
# Incoming events/output for the GPUI side; 2.x is already in the tree via gpui.
async-channel = "2"
# Microphone capture for voice input (SPEC §20G, ADR 0045): WASAPI on Windows, ALSA on Linux.
cpal = "0.18.2"
# gpui snapshot pinned by gpui-component 0.7 (ADR 0001); the platform crate provides `application()`.
# `x11`/`wayland`: Linux windowing backends (off by default; without one the app panics at start).
# `font-kit`: the macOS text system (off by default; without it macOS renders no text at all).
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["x11", "wayland", "font-kit"] }
# Clipboard bitmaps (Windows CF_DIB → BMP) re-encoded as PNG for `attachment.save` (ADR 0026);
# already in the tree via gpui.
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
interprocess = { version = "2.4.4", features = ["tokio"] }
# Mermaid diagrams of the Docs preview (ADR 0021): pure Rust, SVG only (no CLI, no PNG).
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
mkrew-core = { version = "0.2.0", path = "../mkrew-core" }
mkrew-daemon = { version = "0.2.0", path = "../mkrew-daemon" }
mkrew-protocol = { version = "0.2.0", path = "../mkrew-protocol" }
# Docs preview render model (SPEC §12); no html renderer / CLI needed.
pulldown-cmark = { version = "0.13.4", default-features = false }
# QR code of the phone link (spec 2026-10-12-phone-access-ui-design.md): pure Rust, no
# dependencies; `phone.rs` draws the matrix as an SVG.
qrcodegen = "1.8.0"
serde = { version = "1", features = ["derive"] }
# Tab layouts are opaque JSON on the wire (`TerminalTab.layout`).
serde_json = "1"
# Docs "View changes": sent snapshot vs current file (SPEC §4, §12).
similar = "3.2"
# Files viewer highlighting (SPEC §12A): bundled syntaxes, pure-Rust regex (no onig), no themes.
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
thiserror = "2"
# The IPC thread runs a single-threaded runtime (SPEC §7 client side).
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros", "process", "time"] }
# `<config>/mkrew/keymap.toml` (SPEC §13); same major as mkrew-core.
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Same major as mkrew-protocol so `Ulid` types match.
ulid = { version = "1", features = ["serde"] }
# HTTPS POST of voice recordings to the speech-to-text API (SPEC §20G, ADR 0045); blocking
# (runs on the background executor), rustls so no OpenSSL on any OS.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
# Taskbar badge, flashing, tray icon and hiding the window (SPEC §20J, ADR 0064). Same 0.62 and
# 0.6 that gpui's Windows backend already builds with, so the tree gains no package; the
# features are ones it already enables.
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# App icon resource (build.rs); same version gpui already builds with.
embed-resource = "3"

[dev-dependencies]
insta = "1"
# Stress test memory/CPU probes; same version as spike-term (already in the tree via gpui).
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
tempfile = "3"
