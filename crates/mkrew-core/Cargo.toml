[package]
name = "mkrew-core"
description = "Mkrew core: models, agent profile parsing and the session state machine (SPEC §6)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Shares `SessionState` with the wire format (no tokio/GPUI/SQLite there either, SPEC §4).
mkrew-protocol = { version = "0.2.0", path = "../mkrew-protocol" }
directories = "6"
globset = "0.4.20"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
ulid = "1"

[dev-dependencies]
insta = "1.49"
tempfile = "3"
