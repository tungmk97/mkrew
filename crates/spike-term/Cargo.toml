[package]
name = "spike-term"
description = "M0 spike: terminal emulation rendered in GPUI"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0"
# gpui snapshot pinned by gpui-component 0.7 (ADR 0001); the platform crate provides `application()`.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7" }
portable-pty = "0.9"
# Own RSS/CPU for `--stats`; 0.31 is already in the tree via gpui.
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

[dev-dependencies]
insta = "1"
