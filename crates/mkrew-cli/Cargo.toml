[package]
name = "mkrew-cli"
description = "Mkrew command-line client `mk` (SPEC §9)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "mk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
interprocess = "2.4.4"
mkrew-core = { version = "0.1.0", path = "../mkrew-core" }
mkrew-daemon = { version = "0.1.0", path = "../mkrew-daemon" }
mkrew-protocol = { version = "0.1.0", path = "../mkrew-protocol" }
serde = "1"
serde_json = "1"
ulid = "1"

[target.'cfg(windows)'.dependencies]
# `SetHandleInformation`: keep the detached daemon from inheriting mk's stdio pipes.
# `Get/SetConsoleMode`: VT input/output for `mk attach` (crossterm raw mode sets neither).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.27.0"
