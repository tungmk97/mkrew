[package]
name = "mkrew-daemon"
description = "Mkrew daemon: owns state, SQLite and agent PTYs; serves the local socket (SPEC §8)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Headless emulator per session (SPEC §8); same version as the M0 spike.
alacritty_terminal = "0.26"
anyhow = "1"
# Canonical paths without `\\?\`: an 8.3 / case variant of the project folder is still inside
# it (plan links, hook edits); already in the tree through mkrew-cli.
dunce = "1.0.5"
# `.gitignore` matching for the project file watcher (SPEC §4).
ignore = "0.4.33"
interprocess = { version = "2.4.4", features = ["tokio"] }
mkrew-core = { version = "0.1.0", path = "../mkrew-core" }
mkrew-protocol = { version = "0.1.0", path = "../mkrew-protocol" }
mkrew-store = { version = "0.1.0", path = "../mkrew-store" }
# Project file watcher (SPEC §4, §8); the crate's own `notify` module means `::notify` in code.
notify = "8.2.0"
# Quick open ranking for `fs.find` (SPEC §12A).
nucleo-matcher = "0.3.1"
portable-pty = "0.9"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "signal", "time", "process"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Same major as mkrew-protocol so `Ulid` types match.
ulid = "1"

[target.'cfg(windows)'.dependencies]
# SDDL string for the named pipe's security descriptor (`interprocess` takes a `U16CStr`).
widestring = "1"
# WinRT toasts whose click opens a `mkrew://` link (ADR 0078); same 0.62 and features
# tauri-winrt-notification already builds, so the tree gains no package.
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }
# `SetHandleInformation`: keep a detached daemon from inheriting the client's stdio pipes;
# `SetThreadExecutionState` for keep awake (SPEC §20A.5); a kill-on-close job object ties
# `mk web` to the daemon (ADR 0053); `CoIncrementMTAUsage` keeps toasts' WinRT factories valid;
# registry writes register `mkrew://` (ADR 0078).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Registry"] }

[target.'cfg(unix)'.dependencies]
# Safe `kill(pid, SIGKILL)` for forced session kills; 1.x is already in the tree.
rustix = { version = "1", features = ["process"] }

[target.'cfg(not(windows))'.dependencies]
# OS notifications on needs_input/done (SPEC §8); default `z` = pure-Rust zbus on Linux.
# Windows shows WinRT toasts itself (ADR 0078).
notify-rust = "4.18.1"

[dev-dependencies]
tempfile = "3"
# Paused clock for the watcher's debounce test.
tokio = { version = "1", features = ["test-util"] }
