# SPEC §17: fmt check, clippy -D warnings and all tests on Windows + Linux; clippy on macOS.
# Same steps as `scripts/verify.sh`, which is what local sessions run.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Cold Windows builds of gpui + bundled SQLite are slow.
    timeout-minutes: 60
    steps:
      # Windows runners default to autocrlf=true; the repo and its fixtures/snapshots are LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # gpui's x11/wayland backends (mkrew-ui) link against these.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libasound2-dev
      # Runs in Git Bash on Windows. Tests need the daemon + fakeagent bins, which
      # `cargo test --workspace` builds.
      - run: bash scripts/verify.sh
        shell: bash

  # macOS: compile and lint every target, so `cfg(target_os = "macos")` code is checked.
  # The tests pin the PC defaults; macOS key behavior is tested on Windows through the
  # `*_for(Os::Mac)` functions (ADR 0098).
  macos:
    name: clippy (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
