# Release packages (SPEC §4, ADR 0071): Windows setup .exe, macOS Mkrew.app zip, Linux tar.gz.
# A `v*` tag push publishes them as the latest GitHub Release, which running Mkrew copies offer.
name: Release

on:
  push:
    tags: ["v*"]
  # Manual dry run of the packaging path (still uploads artifacts only).
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # The tag must name the version being built (README "Releasing").
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)"
          [ "${GITHUB_REF_NAME#v}" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml $want" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # gpui's x11/wayland backends (mkrew-ui) link against these.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libasound2-dev
      - if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-setup.ps1
      - if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/package.sh --app
      - if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mkrew-${{ github.ref_name }}-${{ matrix.os }}
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}" --generate-notes
          --title "Mkrew ${{ github.ref_name }}"
