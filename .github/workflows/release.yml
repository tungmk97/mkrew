# Release packages (SPEC §4, ADR 0071, ADR 0100): Windows setup .exe, macOS Mkrew.app zip (signed and notarized with the Apple secrets), Linux tar.gz.
# A `v*` tag push publishes them as the latest GitHub Release, which running Mkrew copies offer.
name: Release

on:
  push:
    tags: ["v*"]
  # Manual dry run of the packaging path (still uploads artifacts only).
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # The tag must name the version being built (README "Releasing").
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)"
          [ "${GITHUB_REF_NAME#v}" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml $want" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # gpui's x11/wayland backends (mkrew-ui) link against these.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libasound2-dev
      - if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-setup.ps1
      # Developer ID signing and notarization (ADR 0100) run only when the repository has the
      # Apple secrets; without them (a fork, a dry run) the app is ad-hoc signed as before.
      # Secrets: MACOS_CERTIFICATE_P12 (base64 of the "Developer ID Application" .p12),
      # MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY ("Developer ID Application: Name (TEAMID)"),
      # APPLE_ID, APPLE_APP_PASSWORD (an app-specific password) and APPLE_TEAM_ID.
      - id: apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: echo "signing=$([ -n "$CERTIFICATE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'macOS' && steps.apple.outputs.signing == 'true'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/mkrew.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"
      - if: runner.os == 'macOS'
        shell: bash
        env:
          MKREW_SIGN_IDENTITY: ${{ steps.apple.outputs.signing == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          MKREW_NOTARY_APPLE_ID: ${{ steps.apple.outputs.signing == 'true' && secrets.APPLE_ID || '' }}
          MKREW_NOTARY_PASSWORD: ${{ steps.apple.outputs.signing == 'true' && secrets.APPLE_APP_PASSWORD || '' }}
          MKREW_NOTARY_TEAM_ID: ${{ steps.apple.outputs.signing == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: bash scripts/package.sh --app
      - if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mkrew-${{ github.ref_name }}-${{ matrix.os }}
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}" --generate-notes
          --title "Mkrew ${{ github.ref_name }}"
