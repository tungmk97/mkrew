# Claude Code (SPEC §6). Patterns are starting points; refine from recorded output.
name    = "Claude Code"
# Short badge before the agent name (≤ 3 characters). Missing = the id's first letter.
icon    = "✻"
command = "claude"
args    = []
# How the task prompt reaches the agent:
#   "arg"  = append prompt as the last argument
#   "type" = type prompt into the PTY once the agent is ready, then Enter
#   "none" = do not send
prompt_mode = "arg"
# Optional extra environment variables for this agent
env = {}
# Resume command; {session_id} = native_session_id. Empty = no resume.
resume = "claude --resume {session_id}"
# One-shot text (✦ commit message / prompt rewrite): non-interactive, prompt on stdin.
oneshot = "claude -p"

[state]
mode = "hook+screen"            # "hook" | "screen" | "hook+screen"
idle_after_ms = 3000
needs_input_patterns = ['(?i)do you want to', '(?i)\(y/n\)', '❯ 1\. Yes']

# Token usage from the session transcript (SPEC §20E.3). Remove to show none.
[usage]
format = "claude_jsonl"         # "claude_jsonl" | "codex_jsonl" | "omp_jsonl"
context_window = 200000         # tokens, for the ctx % shown
