# Scriptable fake agent used by tests and demos (SPEC §16), built from crates/mkrew-fakeagent.
# Runs the built-in `ask` scenario; pick another with `MKREW_FAKE_SCENARIO=<file|name>`
# (built-ins: ask, flood, omp) or `args = ["--scenario", "<file|name>"]`.
name = "Fake agent"
icon = "ƒ"
command = "mkrew-fakeagent"
args = []
prompt_mode = "none"

[state]
mode = "screen"
idle_after_ms = 1000
needs_input_patterns = ['(?i)do you want to proceed\? \(y/n\)']
